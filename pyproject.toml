[project]
name = "hopper"
version = "0.1.0"
description = "A fast, project-aware todo CLI for hopping between work streams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jstoobz" }]
keywords = ["cli", "todo", "backlog", "productivity"]
dependencies = [
    "typer>=0.12",
    "filelock>=3.13",
]

[project.urls]
Homepage = "https://github.com/jstoobz/hopper"
Repository = "https://github.com/jstoobz/hopper"

[project.scripts]
hopper = "hopper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
